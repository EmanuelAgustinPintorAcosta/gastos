<!DOCTYPE html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F3EB" />
    <meta name="description" content="Hogar — orden de convivencia para Guada y Ema" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Hogar" />
    <title>Hogar — Guada &amp; Ema</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <!-- LOGIN: visible de entrada (no depende del JS para verse) -->
    <div class="login-screen" id="login-screen">
      <div class="login-card">
        <div class="brand login-brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <div>
            <p class="brand-kicker">Orden de convivencia</p>
            <h1>Hogar</h1>
          </div>
        </div>
        <p class="login-lead">Elegí quién sos y entrá. Casa e ingresos se comparten; lo personal queda privado.</p>

        <p class="field-label">Soy</p>
        <div class="who-pills login-who" id="login-who">
          <button type="button" class="pill guadalupe active" data-login-who="guadalupe">Guada</button>
          <button type="button" class="pill emanuel" data-login-who="emanuel">Ema</button>
        </div>

        <form id="login-form" autocomplete="on">
          <label class="field">
            <span>Contraseña</span>
            <input
              type="password"
              id="login-password"
              name="password"
              autocomplete="current-password"
              inputmode="numeric"
              placeholder="••••"
              required
              maxlength="64"
            />
          </label>
          <p class="login-error" id="login-error" hidden></p>
          <button class="btn primary" type="submit" id="login-submit">Entrar</button>
        </form>
        <p class="login-hint" id="install-hint" hidden></p>
      </div>
    </div>

    <div class="app" id="app" hidden>
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <div>
            <p class="brand-kicker" id="session-kicker">Sesión</p>
            <h1>Hogar</h1>
          </div>
        </div>
        <div class="topbar-right">
          <button class="icon-btn" id="btn-settings" type="button" title="Cuenta" aria-label="Cuenta">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="12" cy="8" r="3.2" stroke="currentColor" stroke-width="1.8" />
              <path d="M5 19c1.8-3.2 4-4.8 7-4.8s5.2 1.6 7 4.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            </svg>
          </button>
          <div class="month-nav" role="group" aria-label="Mes">
            <button class="icon-btn ghost" id="btn-prev-month" type="button" aria-label="Mes anterior">‹</button>
            <button class="month-label" id="btn-month" type="button"></button>
            <button class="icon-btn ghost" id="btn-next-month" type="button" aria-label="Mes siguiente">›</button>
          </div>
        </div>
      </header>

      <nav class="tabs" id="tabs" aria-label="Secciones">
        <button type="button" data-view="resumen" class="active">Resumen</button>
        <button type="button" data-view="casa">Casa</button>
        <button type="button" data-view="personal">Personal</button>
        <button type="button" data-view="ingresos">Ingresos</button>
      </nav>

      <main class="content" id="view-root"></main>
    </div>

    <button class="fab" id="btn-add" type="button" hidden>
      <span>+</span>
      <em>Cargar</em>
    </button>

    <div class="sheet" id="type-sheet" hidden>
      <div class="sheet-backdrop" data-close="type-sheet"></div>
      <div class="sheet-card compact">
        <div class="sheet-handle"></div>
        <h2 class="sheet-heading">¿Qué querés cargar?</h2>
        <p class="sheet-sub">Casa e ingresos los ven los dos. Lo personal solo vos.</p>
        <div class="type-pick">
          <button type="button" class="type-card income" data-pick="income">
            <span class="type-badge">Ingreso</span>
            <strong>Tu sueldo u extra</strong>
            <small>Visible para los dos. Define tu % de la casa.</small>
          </button>
          <button type="button" class="type-card shared" data-pick="shared">
            <span class="type-badge">Casa</span>
            <strong>Gasto compartido</strong>
            <small>Visible para los dos. Se reparte según sueldos.</small>
          </button>
          <button type="button" class="type-card personal" data-pick="personal">
            <span class="type-badge">Personal</span>
            <strong>Gasto solo tuyo</strong>
            <small>Privado. La otra persona no lo ve.</small>
          </button>
        </div>
      </div>
    </div>

    <div class="sheet" id="sheet" hidden>
      <div class="sheet-backdrop" data-close="sheet"></div>
      <form class="sheet-card" id="tx-form" autocomplete="off">
        <div class="sheet-handle"></div>
        <div class="sheet-title-row">
          <div>
            <p class="form-kicker" id="form-kicker">Gasto de casa</p>
            <h2 id="sheet-title">Nuevo movimiento</h2>
          </div>
          <button class="icon-btn" type="button" data-close="sheet" aria-label="Cerrar">✕</button>
        </div>

        <div class="form-banner" id="form-banner"></div>

        <label class="field" id="who-field">
          <span id="who-label">Quién pagó</span>
          <div class="who-pills compact" id="form-who"></div>
        </label>

        <label class="field amount-field">
          <span>Monto</span>
          <div class="amount-wrap">
            <span>$</span>
            <input id="amount" inputmode="decimal" placeholder="0" required />
          </div>
        </label>

        <label class="field">
          <span>Categoría</span>
          <div class="chips" id="category-chips"></div>
        </label>

        <div class="field-row">
          <label class="field">
            <span>Fecha</span>
            <input type="date" id="date" required />
          </label>
          <label class="toggle-field" id="recurring-wrap">
            <input type="checkbox" id="recurring" />
            <span>Gasto fijo del mes</span>
          </label>
        </div>

        <label class="field">
          <span>Nota <em>(opcional)</em></span>
          <input type="text" id="note" maxlength="120" placeholder="Ej. Disco, alquiler marzo…" />
        </label>

        <div class="sheet-actions">
          <button class="btn danger ghost" type="button" id="btn-delete" hidden>Eliminar</button>
          <button class="btn primary" type="submit" id="btn-save">Guardar</button>
        </div>
      </form>
    </div>

    <div class="sheet" id="settings-sheet" hidden>
      <div class="sheet-backdrop" data-close="settings-sheet"></div>
      <div class="sheet-card compact">
        <div class="sheet-handle"></div>
        <div class="sheet-title-row">
          <h2>Tu cuenta</h2>
          <button class="icon-btn" type="button" data-close="settings-sheet" aria-label="Cerrar">✕</button>
        </div>
        <p class="muted backup-copy" id="settings-user">—</p>

        <form id="password-form">
          <label class="field">
            <span>Nueva contraseña</span>
            <input type="password" id="new-password" name="new-password" autocomplete="new-password" minlength="4" maxlength="64" placeholder="Mínimo 4 caracteres" required />
          </label>
          <label class="field">
            <span>Repetir contraseña</span>
            <input type="password" id="new-password-2" name="new-password-confirm" autocomplete="new-password" minlength="4" maxlength="64" required />
          </label>
          <p class="login-error" id="password-error" hidden></p>
          <button class="btn primary" type="submit">Cambiar contraseña</button>
        </form>

        <button class="btn ghost" type="button" id="btn-logout" style="margin-top: 12px; width: 100%">Cerrar sesión</button>
      </div>
    </div>

    <div class="toast" id="toast" hidden></div>
    <div class="boot" id="boot" hidden>Conectando…</div>

    <script src="js/config.js"></script>
    <script src="js/vendor/supabase.min.js"></script>
    <script src="js/app.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/sw.js").catch(function (err) {
            console.warn("SW", err);
          });
        });
      }
    </script>
  </body>
</html>
